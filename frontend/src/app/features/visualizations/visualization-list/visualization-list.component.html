<app-page-header
  title="Visualizations"
  subtitle="Every pull request, branch, commit range and working-tree run, newest first."
/>

<div class="dd-ag-grid-panel flex min-h-0 flex-1 flex-col gap-4 p-4 sm:p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-[var(--color-text-tertiary)]" data-testid="count">{{ countLabel() }}</p>
    <div class="flex flex-wrap items-center justify-end gap-2">
      @if (repoFilter() !== null) {
        <span class="dd-pill dd-pill--outline !gap-1 !pr-1" data-testid="repo-chip">
          {{ repoChipLabel() }}
          <button
            mat-icon-button
            type="button"
            class="!h-6 !w-6 !p-0"
            aria-label="Clear repository filter"
            matTooltip="Clear repository filter"
            (click)="clearRepoFilter()"
          >
            <mat-icon class="!h-4 !w-4 !text-base" aria-hidden="true">close</mat-icon>
          </button>
        </span>
      }
      <button
        mat-stroked-button
        type="button"
        class="!h-10 !rounded-xl"
        [matMenuTriggerFor]="statusMenu"
        aria-label="Filter visualizations by status"
      >
        <mat-icon aria-hidden="true">filter_list</mat-icon>
        {{ statusFilterLabel() }}
      </button>
      <mat-menu #statusMenu="matMenu" xPosition="before">
        @for (f of statusFilters; track f.value) {
          <button mat-menu-item type="button" (click)="setStatusFilter(f.value)">
            <mat-icon aria-hidden="true">{{ statusFilter().value === f.value ? 'check' : '' }}</mat-icon>
            <span>{{ f.label }}</span>
          </button>
        }
      </mat-menu>
      <button mat-icon-button type="button" aria-label="Refresh" matTooltip="Refresh" (click)="refresh()">
        <mat-icon aria-hidden="true">refresh</mat-icon>
      </button>
    </div>
  </div>
  <div class="min-h-0 flex-1 overflow-hidden">
    <app-data-grid
      [serverPagination]="true"
      [serverPageLoader]="pageLoader"
      [serverRefreshKey]="refreshKey()"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [searchEnabled]="false"
      [rowHeight]="56"
      [columnDefs]="columns"
      [defaultColDef]="defaultColDef"
      [rowClassRules]="rowClassRules"
      emptyIcon="photo_library"
      [emptyTitle]="emptyTitle()"
      [emptyMessage]="emptyMessage()"
      (cellClicked)="onCellClicked($event)"
      (rowClicked)="onRowClicked($event)"
    />
  </div>
</div>
