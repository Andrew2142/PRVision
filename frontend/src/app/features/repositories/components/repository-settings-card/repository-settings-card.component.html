<mat-card
  class="h-full !rounded-2xl border border-[color:var(--color-border)] bg-[var(--color-bg-secondary)] p-5 shadow-[var(--shadow-md)]"
  data-testid="repository-settings-card"
>
  <div class="mb-3">
    <h3 class="text-lg font-semibold text-[var(--color-text-primary)]">Repository settings</h3>
    <p class="mt-1 max-w-2xl text-sm text-[var(--color-text-secondary)]">How PRVision writes harnesses here.</p>
  </div>
  <div class="flex flex-wrap items-start gap-3">
    <mat-form-field class="min-w-0 flex-1">
      <mat-label>States per component</mat-label>
      <mat-select
        data-testid="settings-state-allowance"
        [value]="allowance()"
        [disabled]="saving()"
        (valueChange)="allowance.set($event)"
      >
        @for (n of options; track n) {
          <mat-option [value]="n">{{ n }}</mat-option>
        }
      </mat-select>
      <mat-hint
        >A maximum, not a target. PRVision only adds states that look different; simple components get just
        Default.</mat-hint
      >
    </mat-form-field>
    <button
      mat-flat-button
      color="primary"
      type="button"
      class="mt-2 !rounded-xl"
      data-testid="settings-save"
      [disabled]="!changed() || saving()"
      (click)="save()"
    >
      @if (saving()) {
        <mat-spinner diameter="18" class="!inline-block align-middle mr-2" />
      }
      Save
    </button>
  </div>
  @if (savedText(); as text) {
    <p class="mt-3 text-sm text-[var(--color-text-secondary)]" data-testid="settings-saved">{{ text }}</p>
  }
</mat-card>
